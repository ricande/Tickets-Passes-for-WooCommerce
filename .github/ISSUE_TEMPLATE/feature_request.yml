name: Feature request
description: Suggest a behaviour change or addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Security-related reports belong in [SECURITY.md](https://github.com/ricande/Tickets-Passes-for-WooCommerce/blob/main/SECURITY.md), not here.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
