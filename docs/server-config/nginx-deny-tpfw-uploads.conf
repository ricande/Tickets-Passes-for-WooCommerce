# Tickets & Passes for WooCommerce — deny direct static access to private files.
#
# Include this inside the server { } block that serves WordPress (the same
# server that already has `location ~ \.php$`).
#
# Blocks HTTP to /wp-content/uploads/tpfw-* only.
# Does not block the rest of the media library.
# Does not block the plugin file route (?tpfw_file=…), which is PHP.
#
# Apache/LiteSpeed: the plugin writes .htaccess under the tpfw-* folder.
# nginx ignores .htaccess — this location is required.
#
#   include /path/to/plugin/docs/server-config/nginx-deny-tpfw-uploads.conf;

location ^~ /wp-content/uploads/tpfw- {
	deny all;
}
